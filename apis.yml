apis:
- aid: dagshub:dagshub-rest-api
  name: DagsHub REST API
  humanURL: https://dagshub.com/docs/reference/api/
  baseURL: https://dagshub.com/api/v1
  tags:
  - REST
  - Repos
  - Issues
  - Branches
  description: >-
    DagsHub's primary REST API mirrors the Gitea API for repositories, issues, pulls, branches, and users,
    with DagsHub-specific extensions for data, experiments, and annotations. Token-based authentication.
  properties:
  - type: Documentation
    url: https://dagshub.com/docs/reference/api/
  - type: Authentication
    url: https://dagshub.com/docs/reference/api/authentication/
- aid: dagshub:dagshub-mlflow
  name: DagsHub MLflow Tracking Endpoint
  humanURL: https://dagshub.com/docs/integration_guide/mlflow_tracking/
  baseURL: https://dagshub.com/{user}/{repo}.mlflow
  tags:
  - MLflow
  - Experiment Tracking
  description: >-
    Each DagsHub repo provides a hosted MLflow tracking server endpoint. Point `MLFLOW_TRACKING_URI` at
    the repo's `.mlflow` URL and authenticate with a token.
  properties:
  - type: Documentation
    url: https://dagshub.com/docs/integration_guide/mlflow_tracking/
